name: iOS build to TestFlight
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # Keep only the PEM block: drops stray characters pasted after the END line and any CR/space.
          printf "%s\n" "$ASC_KEY_P8" | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | sed -E 's/^(-----END PRIVATE KEY-----).+$/\1/' \
            | awk '/-----BEGIN PRIVATE KEY-----/{f=1} f{print} /-----END PRIVATE KEY-----/{exit}' \
            > ~/.appstoreconnect/private_keys/AuthKey_KH8234LV5W.p8
          head -c 40 ~/.appstoreconnect/private_keys/AuthKey_KH8234LV5W.p8 | head -1; wc -l < ~/.appstoreconnect/private_keys/AuthKey_KH8234LV5W.p8
      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_KH8234LV5W.p8 \
            -authenticationKeyID KH8234LV5W \
            -authenticationKeyIssuerID 5cb3a9d0-b29a-49a5-a584-fe394eaa5f2d \
            DEVELOPMENT_TEAM=6KFP9Q7482 CURRENT_PROJECT_VERSION=${{ github.run_number }} archive
      - name: Export and upload to App Store Connect
        working-directory: ios/App
        run: |
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>6KFP9Q7482</string>
          <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_KH8234LV5W.p8 \
            -authenticationKeyID KH8234LV5W \
            -authenticationKeyIssuerID 5cb3a9d0-b29a-49a5-a584-fe394eaa5f2d
